  <head>
    <meta charset="UTF-8" />

    <meta
      name="description"
      content="Upload study materials, ask a page-cited AI Study Tutor, take grounded diagnostic quizzes, decode Mistake DNA, and follow an adaptive revision plan."
    />
    <meta property="og:title" content="LearnMate — AI-Powered Personalized Study Companion" />
    <meta
      property="og:description"
      content="Upload study materials, ask a page-cited AI Study Tutor, take grounded diagnostic quizzes, decode Mistake DNA, and follow an adaptive revision plan."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600&family=Kalam:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('learnmate_theme_v1') || 'light';
          var prefersDark =
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (saved === 'system' && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
